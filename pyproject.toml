[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panofm"
version = "0.1.0"
description = "Research implementation of PanoFM for panoramic radiographs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "scikit-learn>=1.4,<2",
    "pydicom>=3,<4",
    "transformers>=4.45,<5",
    "accelerate>=0.34,<2",
]

[project.scripts]
panofm = "panofm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
